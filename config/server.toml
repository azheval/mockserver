# Mock Integration Server — runtime configuration.
# Scenario declarations are loaded from the files below.
version = 1
scenario_files = ["../scenarios/orders.mock", "../scenarios/files.mock", "../scenarios/notifications.mock"]

[server]
http_listen = "127.0.0.1:8090"
admin_listen = "127.0.0.1:8091"
fixtures_dir = "../fixtures"
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "60s"
shutdown_timeout = "10s"
max_body_bytes = 52428800

[defaults]
unmatched_status = 404
strict = false

[admin]
enabled = true

[logging]
level = "info"
format = "text"
log_bodies = false
